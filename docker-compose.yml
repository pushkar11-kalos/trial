# Run the whole stack with:  docker compose up --build
# Then open http://localhost:3000 and log in with a demo account (see README).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metracheck
      POSTGRES_PASSWORD: metracheck
      POSTGRES_DB: metracheck
    ports:
      - "5432:5432"
    volumes:
      - metracheck_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metracheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://metracheck:metracheck@postgres:5432/metracheck
      JWT_SECRET_KEY: dev-only-change-me-in-production
      ALLOWED_ORIGINS: http://localhost:3000
      OCR_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-2.0-flash
      STORAGE_ROOT: /app/storage/uploads
      DEMO_ASSETS_ROOT: /app/storage/demo_assets
      OCR_REVIEW_CONFIDENCE_THRESHOLD: "75"
    ports:
      - "8000:8000"
    volumes:
      - metracheck_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  metracheck_pg_data:
  metracheck_storage:
